name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: ci
    # Build the image on main pushes to catch Dockerfile regressions early.
    # Push to a registry only if you add a login step + `push: true`.
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: false
          tags: stock-drawdown-calculator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
